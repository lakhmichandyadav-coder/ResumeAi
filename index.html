<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ResumeAi</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">


    <!-- MAIN HEADING -->

    <h1>ResumeAi</h1>


    <!-- BASIC DETAILS -->

    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >

    <br><br>


    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <br><br>


    <input
        type="text"
        id="phone"
        placeholder="Phone Number"
    >

    <br><br>


    <input
        type="text"
        id="jobTitle"
        placeholder="Job Title"
    >

    <br><br>


    <!-- PHOTO -->

    <input
        type="file"
        id="photo"
        accept="image/*"
    >

    <br><br>


    <!-- TEMPLATE -->

    <label>
        <b>Select Resume Template</b>
    </label>

    <br><br>


    <select id="template">

        <option value="classic">
            Classic
        </option>

        <option value="modern">
            Modern
        </option>

        <option value="professional">
            Professional
        </option>

        <option value="creative">
            Creative
        </option>

        <option value="minimal">
            Minimal
        </option>

    </select>

    <br><br>


    <!-- EDUCATION -->

    <input
        type="text"
        id="education"
        placeholder="Education"
    >

    <br><br>


    <!-- SKILLS -->

    <textarea
        id="skills"
        placeholder="Skills (Example: HTML, CSS, JavaScript)"
    ></textarea>

    <br><br>


    <!-- EXPERIENCE -->

    <textarea
        id="experience"
        placeholder="Experience (Example: Fresher)"
    ></textarea>

    <br><br>


    <!-- AI SUMMARY -->

    <button onclick="generateAI()">
        🤖 Generate AI Summary
    </button>

    <br><br>


    <textarea
        id="summary"
        placeholder="AI Professional Summary"
    ></textarea>

    <br><br>


    <!-- PROJECTS -->

    <textarea
        id="projects"
        placeholder="Projects (Example: AI Resume Builder, Weather App)"
    ></textarea>

    <br><br>


    <!-- LANGUAGES -->

    <input
        type="text"
        id="languages"
        placeholder="Languages (Example: Hindi, English)"
    >

    <br><br>


    <!-- GITHUB -->

    <input
        type="url"
        id="github"
        placeholder="GitHub Profile Link"
    >

    <br><br>


    <!-- LINKEDIN -->

    <input
        type="url"
        id="linkedin"
        placeholder="LinkedIn Profile Link"
    >

    <br><br>


    <!-- GENERATE -->

    <button onclick="generateResume()">
        Generate Resume
    </button>


    <!-- PREMIUM -->

    <div class="premium-box">

        <h2>
            💎 ResumeAi Premium
        </h2>

        <p>
            Unlock premium templates and features.
        </p>


        <div class="premium-features">

            <p>
                🔒 Modern Template
            </p>

            <p>
                🔒 Professional Template
            </p>

            <p>
                🔒 Creative Template
            </p>

            <p>
                🔒 Minimal Template
            </p>

            <p>
                🔒 Premium Resume Designs
            </p>

        </div>


        <button onclick="goPremium()">
            💎 Go Premium
        </button>

    </div>


    <!-- OTHER BUTTONS -->

    <button onclick="darkMode()">
        🌙 Dark Mode
    </button>


    <button onclick="clearForm()">
        Clear Form
    </button>


    <button onclick="downloadPDF()">
        Download Resume (PDF)
    </button>


    <!-- LIVE PREVIEW -->

    <div id="resume"></div>


</div>


<script src="script.js"></script>

</body>

</html>
